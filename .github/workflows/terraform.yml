name: Terraform Infrastructure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: Terraform Init
        run: terraform init
      
      - name: Unlock State
        run: terraform force-unlock -force cfd42c6a-e07c-1652-e5d0-0253b5f7834a

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_cluster_admin_object_id: ${{ secrets.TF_VAR_cluster_admin_object_id }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_cluster_admin_object_id: ${{ secrets.TF_VAR_cluster_admin_object_id }}
