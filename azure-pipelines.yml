trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: TerraformInstaller@0
    displayName: Install Terraform
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: Terraform Init & Apply
    inputs:
      azureSubscription: cloudaura-azure-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        curl -LO https://github.com/Azure/kubelogin/releases/download/v0.2.19/kubelogin-linux-amd64.zip
        unzip kubelogin-linux-amd64.zip
        sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
        terraform init
        
        # Sahi flag -force hai, -auto-approve nahi
        terraform force-unlock -force 04e3ac2f-95ee-915b-7d5b-3a28558751b0
        
        terraform apply -auto-approve -lock=false